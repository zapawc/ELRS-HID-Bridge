; PlatformIO Project Configuration File

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
; Release-critical packages pinned to the known-good hardware-tested environment
; captured 2026-08-16. The maxgerhardt platform source itself remains the
; required Arduino-Pico integration; framework/toolchain versions are pinned
; explicitly below so upstream package changes cannot silently alter the build.
platform_packages =
    earlephilhower/framework-arduinopico@1.60000.0
    earlephilhower/toolchain-rp2040-earlephilhower@5.160100.260719

lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5

build_flags =
    -DUSE_TINYUSB

; User-visible USB identity. Keep the product string synchronized with the
; HID interface string in src/usb_hid.cpp.
board_build.arduino.earlephilhower.usb_product = ELRS-HID-Bridge
board_build.arduino.earlephilhower.usb_manufacturer = zapawc

; -----------------------------------------------------------------------------
; Release build
;
; HID only. No USB CDC debug serial interface.
; -----------------------------------------------------------------------------

[env:pico]
build_flags =
    ${env.build_flags}
    -DELRS_DEBUG=0


; -----------------------------------------------------------------------------
; Debug build
;
; HID + USB CDC serial logging.
; -----------------------------------------------------------------------------
[env:pico_debug]
build_flags =
    ${env.build_flags}
    -DELRS_DEBUG=1
